# Alembic configuration for RecruitAI
#
# Reemplaza al `init-db.sql` manual con migraciones versionadas. Comandos
# habituales (todos desde el host, dentro del contenedor backend):
#
#   docker exec recruitai-backend alembic current
#   docker exec recruitai-backend alembic revision --autogenerate -m "msg"
#   docker exec recruitai-backend alembic upgrade head
#   docker exec recruitai-backend alembic downgrade -1
#
# Para una BD existente creada por init-db.sql, marcar el estado actual como
# baseline UNA SOLA VEZ con:
#   docker exec recruitai-backend alembic stamp head
#
# La URL no se hardcodea aquí — env.py la lee de settings.DATABASE_URL.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Las migraciones se nombran con timestamp + slug para que el orden cronológico
# coincida con el orden de aplicación. Ej: 2026_05_16_1430-abc123_add_users.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Black-style: la salida del autogenerate la formatea Python sin línea máxima.
# No imponemos un line-length aquí para no entrar en conflicto con el formato
# del resto del proyecto.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
