events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # File upload size (important for CV uploads)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost;

        # DNS interno de Docker (127.0.0.11). Combinado con el uso de VARIABLES
        # en proxy_pass (abajo), obliga a nginx a RE-RESOLVER la dirección de
        # backend/frontend en cada petición (TTL 10s) en vez de cachearla solo al
        # arrancar. Sin esto, al recrear un contenedor (cambia de IP interna)
        # nginx seguía apuntando a la IP vieja y devolvía 502 Bad Gateway hasta
        # reiniciarlo a mano. Por eso quitamos los bloques `upstream`: con
        # variables, nginx no los usa y resuelve por DNS en vivo.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # API routes -> Backend
        location /api/ {
            set $backend_svc backend:8000;
            proxy_pass http://$backend_svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            # 600s: el matching en lote con free tier espaciado (marcapasos
            # de 6s/llamada) puede tomar ~2-4 min con 20 candidatos.
            proxy_read_timeout 600s;
            proxy_connect_timeout 75s;
        }

        # WebSocket for real-time updates
        location /ws/ {
            set $backend_ws backend:8000;
            proxy_pass http://$backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # OpenAPI docs
        location /docs {
            set $backend_docs backend:8000;
            proxy_pass http://$backend_docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $backend_openapi backend:8000;
            proxy_pass http://$backend_openapi;
            proxy_set_header Host $host;
        }

        # Everything else -> Frontend
        location / {
            set $frontend_svc frontend:3000;
            proxy_pass http://$frontend_svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
